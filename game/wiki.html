<!DOCTYPE html>
<html>
<head>
  <title>Recent Changes</title>
</head>
<body>
  <button onclick="fetchRecentChanges()">Fetch Recent Changes</button>
  <div id="output"></div>

  <script>
    function fetchRecentChanges() {
      const start = '2023-01-01T00:00:00Z';
      const end = '2023-01-31T23:59:59Z';
      const apiUrl = `https:                                                                                                                                                     

      fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
          const recentChanges = data.query.recentchanges;
          const output = document.getElementById('output');
          output.innerHTML = '';
          recentChanges.forEach(change => {
            const title = change.title;
            output.innerHTML += `<p><a href="https://as.wikipedia.org/wiki/${title}">${title}</a></p>`;
          });
        })
        .catch(error => console.error('Error:', error));
    }
  </script>
</body>
</html>
