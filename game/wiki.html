<!DOCTYPE html>
<html>
<head>
  <title>Recent Changes</title>
</head>
<body>
  <a>Start Date: </a><input id="startDate">
  <a>End Date: </a><input id="endDate">
  <button onclick="fetchRecentChanges()">Fetch Recent Changes</button>
  <div id="output"></div>
  <script>
  function fetchRecentChanges() {
  const start = new Date(document.getElementById('startDate').value + 'T23:59:59Z').toISOString();
  const end = new Date(document.getElementById('endDate').value + 'T23:59:59Z').toISOString();
  const apiUrl = `https://as.wikipedia.org/w/api.php?action=query&list=recentchanges&rctype=new&rcnamespace=0&rclimit=10&rcstart=` + Date(document.getElementById('startDate').value + 'T23:59:59Z').toISOString() + `&rcend=` + Date(document.getElementById('endDate').value + 'T23:59:59Z').toISOString() + `&format=json&origin=*`                                                                                                                                                     

  console.log(apiUrl);                               

  fetch(apiUrl)
    .then(response => response.json())
    .then(data => {
      const recentChanges = data.query.recentchanges;
      const output = document.getElementById('output');
      output.innerHTML = '';
      recentChanges.forEach(change => {
        const title = change.title;
        output.innerHTML += `//as.wikipedia.org/w/api.php?action=query&list=recentchanges&rctype=new&rcnamespace=0&rclimit=10&rcstart=${start}&rcend=${end}&format=json&origin=*`;

  console.log(apiUrl); // logs the URL to the console

  fetch(apiUrl)
    .then(response => response.json())
    .then(data => {
      const recentChanges = data.query.recentchanges;
      const output = document.getElementById('output');
      output.innerHTML = '';
      recentChanges.forEach(change => {
        const title = change.title;
        output.innerHTML += `<p><a href="https://as.wikipedia.org/wiki/${title}">${title}</a></p>`;
      });
    })
    .catch(error => console.error('Error:', error));
}
    </script>
</body>
</html>
