<!DOCTYPE html>
<html>
<head>
  <title>Recent Changes</title>
</head>
<body>
  <button onclick="fetchRecentChanges()">Fetch news Changes</button>
  <div id="output"></div>

  <script>
    function fetchRecentChanges() {
      const start = '2026-03-01T23:59:59Z';
      const end = '2026-03-30T23:59:59Z';
      const apiUrl = `https://as.wikipedia.org/w/api.php?action=query&list=recentchanges&rctype=new&rcnamespace=0&rcend=2026-03-27T23:59:59Z&rcstart=2026-03-29T00:00:00Z&rclimit=500&format=json&origin=*`                                                                                                                                                   

      fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
          const recentChanges = data.query.recentchanges;
          const output = document.getElementById('output');
          output.innerHTML = '';
          recentChanges.forEach(change => {
            const title = change.title;
            output.innerHTML += `<p><a href="https://as.wikipedia.org/wiki/${title}">${title}</a></p>`;
          });
        })
        .catch(error => console.error('Error:', error));
    }
  </script>
</body>
</html>
