<!DOCTYPE html>
<html>
<head>
  <title>Recent Changes</title>
</head>
<body>
  <a>Start Date: </a><input type='date' id="endDate">
  <a>End Date: </a><input type='date' id="startDate"><br><br>
  <button onclick="fetchRecentChanges()">Fetch Recent Changes</button>
  
  <div id="output"></div>
  <script>

  function fetchRecentChanges() {
    const start = new Date(document.getElementById('startDate').value + 'T23:59:59Z').toISOString();
    const end = new Date(document.getElementById('endDate').value + 'T00:00:00Z').toISOString();
    const apiUrl = `https://as.wikipedia.org/w/api.php?action=query&list=recentchanges&rctype=new&rcnamespace=0&rclimit=500&rcstart=${start}&rcend=${end}&format=json&origin=*`                                                                                                                                                     

    

    fetch(apiUrl)
      .then(response => response.json())
      .then(data => {
        const recentChanges = data.query.recentchanges;
        const output = document.getElementById('output');
        output.innerHTML = '';
        recentChanges.forEach(change => {
          const title = change.title;
          output.innerHTML += `<p>[[${title}|${title}]]</p>`;
        });
      })
      .catch(error => console.error('Error:', error));
  }
</script>
</body>
</html>
